{% extends "base.html" %}
{% block content %}
<h1>Products</h1>
{% if request.args.get('added') %}<p class="notice" data-testid="added-notice">Added to cart.</p>{% endif %}
<div class="grid">
  {% for p in products %}
  <div class="card" data-testid="product-{{ p.id }}">
    <h3 data-testid="product-name">{{ p.name }}</h3>
    <p data-testid="product-price">${{ p.price }}</p>
    {% if p.in_stock %}
    <form method="post" action="/cart/add">
      <input type="hidden" name="product_id" value="{{ p.id }}">
      <label>Qty
        <select name="quantity" data-testid="qty-select">
          {% for q in range(1, 11) %}<option value="{{ q }}">{{ q }}</option>{% endfor %}
        </select>
      </label>
      <button type="submit" data-testid="add-to-cart">Add to cart</button>
    </form>
    {% else %}
    <p data-testid="out-of-stock">Out of stock</p>
    <button disabled data-testid="add-to-cart">Add to cart</button>
    {% endif %}
  </div>
  {% endfor %}
</div>
{% endblock %}
